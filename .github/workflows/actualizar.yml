name: Actualizar viviendas

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar entorno
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Actualizar datos
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone

          archivo = "datos.json"

          with open(archivo, "r", encoding="utf-8") as f:
              data = json.load(f)

          if "anuncios" not in data:
              data["anuncios"] = []

          data["actualizado"] = datetime.now(
              timezone.utc
          ).strftime("%Y-%m-%d %H:%M UTC")

          with open(archivo, "w", encoding="utf-8") as f:
              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("Archivo datos.json preparado correctamente.")
          print(f"Anuncios actuales: {len(data['anuncios'])}")
          print(f"Última actualización: {data['actualizado']}")
          PY

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add datos.json

          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
          else
            git commit -m "Actualización de viviendas"
            git push
          fi
